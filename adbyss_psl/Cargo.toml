[package]
name = "adbyss_psl"
version = "0.24.5"
license = "WTFPL"
authors = ["Josh Stoik <josh@blobfolio.com>"]
edition = "2024"
rust-version = "1.95"
description = "A minimal Public Suffix List hostname validator."
repository = "https://github.com/Blobfolio/adbyss"
keywords = [ "hostname", "validation", "publicsuffix", "idna", "punycode" ]
readme = "README.md"

[package.metadata.docs.rs]
rustc-args = ["--cfg", "docsrs"]
rustdoc-args = ["--cfg", "docsrs"]
features = [ "serde" ]
default-target = "x86_64-unknown-linux-gnu"
targets = [ "x86_64-unknown-linux-gnu", "x86_64-apple-darwin" ]

[build-dependencies]
idna =       { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
brunch =     { workspace = true }
serde_core = { workspace = true }
serde_json = { workspace = true }

[dependencies]
idna =       { workspace = true }
serde_core = { workspace = true, optional = true }
sqlx =       { workspace = true, optional = true }
trimothy =   { workspace = true }

[features]
default = []

# Expose (de)/serialize support for adbyss_psl::Domain.
serde = [ "dep:serde_core" ]

# Add sqlx type/decode/encode support for adbyss_psl::Domain.
sqlx = [ "dep:sqlx" ]

[[bench]]
name = "psl_parse"
harness = false

[[bench]]
name = "psl_email"
harness = false
