[workspace]
resolver = "3"
members = [
    "adbyss",
    "adbyss_psl",
]

[workspace.dependencies]
argyle = "0.16.*"
brunch = "0.12.*"
dactyl = "0.14.*"
fyi_msg = "2.7.*"
idna = "1.0.0"
regex = "1.13.*"
serde = "1.0.*"
serde_json = "1.0.*"
toml = "=1.1"
trimothy = "0.10.*"
utc2k = "0.21.*"
write_atomic = "0.9.*"

[workspace.dependencies.adbyss_psl]
path = "adbyss_psl"

[workspace.dependencies.minreq]
version = "3.0.*"
default-features = false

[workspace.dependencies.nix]
version = "0.31.*"
default-features = false

[workspace.dependencies.serde_core]
version = "1.0.*"
default-features = false

[workspace.dependencies.sqlx]
version = "0.9.0"
default-features = false

[profile.release]
lto = true
codegen-units = 1
strip = true
